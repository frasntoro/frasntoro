<svg xmlns="http://www.w3.org/2000/svg" width="470" height="200" viewBox="0 0 470 200" role="img" aria-label="frasntoro. Hi, I'm Francesco, a Software Engineer and drummer. Sometimes you just need to make some noise.">
  <style>
    /* base state == final state; the animations run backwards from it, so a
       renderer without CSS animation still shows the finished banner. */
    #w0 > rect, #w1 > rect, #w2 > rect, #w3 > rect, #w4 > rect, #s0 > rect, #s1 > rect { transform: none; }
    #type-mask > rect { transform: none; transform-origin: 46px 19px;
                        animation: type .66s steps(6, end) .4s backwards; }
    .caret { opacity: 0; transform: translateX(50.4px);
             animation: caret-move .66s steps(6, end) .4s backwards,
                        caret-blink .5s step-end 2.3; }
    #w0 > rect { transform-origin: 61.8px 52px; animation: wipe .3s steps(16, end) 1.25s backwards; }
    #w1 > rect { transform-origin: 53.4px 69px; animation: wipe .3s steps(16, end) 1.39s backwards; }
    #w2 > rect { transform-origin: 45px 86px; animation: wipe .3s steps(16, end) 1.53s backwards; }
    #w3 > rect { transform-origin: 36.6px 103px; animation: wipe .3s steps(16, end) 1.67s backwards; }
    #w4 > rect { transform-origin: 28.2px 120px; animation: wipe .3s steps(16, end) 1.81s backwards; }
    #s0 > rect { transform-origin: 45px 159px; animation: wipe .7s steps(38, end) 2.35s backwards; }
    #s1 > rect { transform-origin: 75px 181px; animation: wipe .7s steps(38, end) 2.95s backwards; }

    @keyframes wipe { from { transform: scaleX(0); } }
    @keyframes type { from { transform: scaleX(0); } }
    @keyframes caret-move { from { transform: translateX(0); } }
    @keyframes caret-blink { 0%, 49% { opacity: .85; } 50%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="type-mask"><rect x="46" y="8" width="50.4" height="22"/></clipPath>
    <clipPath id="w0"><rect x="61.8" y="39" width="236.2" height="17"/></clipPath>
    <clipPath id="w1"><rect x="53.4" y="56" width="379" height="17"/></clipPath>
    <clipPath id="w2"><rect x="45" y="73" width="395.8" height="17"/></clipPath>
    <clipPath id="w3"><rect x="36.6" y="90" width="404.2" height="17"/></clipPath>
    <clipPath id="w4"><rect x="28.2" y="107" width="404.2" height="17"/></clipPath>
    <clipPath id="s0"><rect x="45" y="145" width="380" height="19"/></clipPath>
    <clipPath id="s1"><rect x="75" y="167" width="320" height="19"/></clipPath>
  </defs>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#6e7781">
    <text x="29.2" y="24" opacity=".6">$</text>
    <g clip-path="url(#type-mask)"><text x="46.0 54.4 62.8 71.2 79.6 88.0" y="24">whoami</text></g>
    <rect class="caret" x="46" y="11.5" width="8.4" height="15"/>
  </g>
<g class="art" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#6e7781">
    <text clip-path="url(#w0)" x="62.8 71.2 79.6 88.0 281.2 289.6" y="52">______</text>
    <text clip-path="url(#w1)" x="54.4 71.2 79.6 88.0 96.4 104.8 113.2 121.6 130.0 138.4 146.8 155.2 172.0 180.4 188.8 197.2 205.6 214.0 222.4 230.8 239.2 247.6 272.8 289.6 298.0 306.4 314.8 323.2 331.6 356.8 365.2 373.6 382.0 390.4 398.8 407.2 415.6 424.0" y="69">/__/__________________//______________</text>
    <text clip-path="url(#w2)" x="46.0 62.8 71.2 79.6 96.4 104.8 113.2 121.6 138.4 146.8 163.6 172.0 188.8 197.2 205.6 214.0 230.8 239.2 256.0 264.4 281.2 289.6 298.0 314.8 323.2 340.0 348.4 365.2 373.6 382.0 390.4 407.2 415.6 432.4" y="86">//_/___/__`/___/__\/__/__\/___/__\</text>
    <text clip-path="url(#w3)" x="37.6 54.4 62.8 71.2 88.0 113.2 130.0 138.4 146.8 163.6 172.0 180.4 205.6 222.4 239.2 256.0 272.8 281.2 289.6 306.4 314.8 323.2 340.0 356.8 382.0 398.8 407.2 415.6 432.4" y="103">/__////_/(__)////_//_/////_//</text>
    <text clip-path="url(#w4)" x="29.2 37.6 46.0 62.8 71.2 79.6 113.2 121.6 130.0 138.4 146.8 155.2 163.6 172.0 180.4 188.8 197.2 205.6 214.0 230.8 239.2 247.6 256.0 264.4 272.8 281.2 289.6 298.0 306.4 314.8 323.2 331.6 340.0 348.4 382.0 390.4 398.8 407.2 415.6 424.0" y="120">/_//_/\__,_/____/_//_/\__/\____/_/\____/</text>
  </g>
<g class="sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">
    <text clip-path="url(#s0)" x="235.0" y="159">Hi, I'm <tspan font-weight="600">Francesco</tspan>, a Software Engineer and drummer.</text>
    <text clip-path="url(#s1)" x="235.0" y="181">Sometimes you just need to make some noise.</text>
  </g>
</svg>
